name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version number (e.g. 0.1). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write # lets tagged builds publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release signing: uses the upload key stored in the repo's Actions secrets
      # (UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD).
      # Without them the bundle is built unsigned, which Play won't accept.
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > upload-key.jks
            printf 'storeFile=upload-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Release bundle will be signed with the upload key."
          else
            echo "::warning::No upload key secrets set; release bundle will be unsigned."
          fi

      - name: Build test APK and release bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.release_version || '0.1' }}
        run: |
          ./gradlew --no-daemon assembleDebug bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk frdmplus-tv-test.apk
          cp app/build/outputs/bundle/release/app-release.aab frdmplus-tv-release-${{ github.run_number }}.aab
          rm -f upload-key.jks keystore.properties

      # Confirms the Play bundle is signed with the expected upload key.
      - name: Verify release signature
        env:
          HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
          EXPECTED: "57:79:73:1F:42:0F:BA:8D:BC:E1:E5:FE:30:B2:41:16:93:A7:D2:C2:13:0D:7F:6D:39:BE:2E:7F:0C:B0:44:52"
        run: |
          AAB=$(ls frdmplus-tv-release-*.aab)
          if [ "$HAS_KEY" != "true" ]; then echo "No upload key secrets; skipping."; exit 0; fi
          FP=$(keytool -printcert -jarfile "$AAB" | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          echo "Bundle signed with SHA-256: $FP"
          if [ "$FP" = "$EXPECTED" ]; then
            echo "OK: release bundle is signed with the FRDM+ upload key."
          else
            echo "::error::Bundle is not signed with the expected upload key (got '$FP')."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frdmplus-tv-test-apk
          path: frdmplus-tv-test.apk

      # The Play Store upload file. Private: download it from the run's page while signed in.
      - uses: actions/upload-artifact@v4
        with:
          name: frdmplus-tv-play-bundle
          path: frdmplus-tv-release-*.aab

      # Every push to main refreshes the "test-build" pre-release, so a TV can
      # always install the newest build from one fixed link:
      # https://github.com/<owner>/<repo>/releases/download/test-build/frdmplus-tv-test.apk
      - name: Update test-build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          files: frdmplus-tv-test.apk
          prerelease: true
          make_latest: false
          body: |
            Newest test build of FRDM+ for Android TV (from the latest commit on main).
            Install on a Google TV / Android TV with the Downloader app; see the README.

      # "Run workflow" with a version number (or pushing a tag like v1.0) publishes a
      # numbered release with the installable APK attached.
      - name: Publish version release
        if: inputs.release_version != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
          name: ${{ inputs.release_version != '' && format('FRDM+ for Android TV v{0}', inputs.release_version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          files: frdmplus-tv-test.apk
          body: |
            First test release of FRDM+ for Android TV / Google TV.

            **Install on your TV:** open the Downloader app, type code **2273451**, press Go, then Install.
            Full step-by-step guide: https://github.com/allenrobberson/frdmplus-androidtv#install-it-on-your-tv-testers-start-here

            - Sign in with your FRDM+ account and watch live events and replays on your TV
            - Remote-control pointer: arrows move it, OK clicks, Menu turns it on/off
            - Full-screen video with play/pause, rewind and fast-forward from the remote
            - Opens on the sign-in screen; stays signed in afterwards

            Fan-made and free. Found a problem? Open an issue with your TV or device model.
