name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # lets tagged builds publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK and release bundle
        run: |
          ./gradlew --no-daemon assembleDebug bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk frdmplus-tv-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: frdmplus-tv-builds
          path: |
            frdmplus-tv-test.apk
            app/build/outputs/bundle/release/*.aab

      # Every push to main refreshes the "test-build" pre-release, so a TV can
      # always install the newest build from one fixed link:
      # https://github.com/<owner>/<repo>/releases/download/test-build/frdmplus-tv-test.apk
      - name: Update test-build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          files: frdmplus-tv-test.apk
          prerelease: true
          make_latest: false
          body: |
            Newest test build of FRDM+ for Android TV (from the latest commit on main).
            Install on a Google TV / Android TV with the Downloader app; see the README.

      # Pushing a version tag like v1.0.0 publishes a numbered release too.
      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frdmplus-tv-test.apk
          prerelease: true
