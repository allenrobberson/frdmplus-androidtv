name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # lets tagged builds publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK and release bundle
        run: |
          ./gradlew --no-daemon assembleDebug bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk frdmplus-tv-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: frdmplus-tv-builds
          path: |
            frdmplus-tv-test.apk
            app/build/outputs/bundle/release/*.aab

      # Pushing a tag like v0.1.0 publishes the APK as a downloadable release,
      # so a TV can install it straight from
      # https://github.com/<owner>/<repo>/releases/latest/download/frdmplus-tv-test.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frdmplus-tv-test.apk
          prerelease: true
          body: Test build for sideloading onto Android TV / Google TV. See the README for install steps.
